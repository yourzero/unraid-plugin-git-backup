# Git Backup — Default Configuration
# This file is read by both the PHP settings page and the backup script.
# Edit via the Unraid WebUI at Settings > Git Backup, or directly here.

# ── Git Settings ──────────────────────────────────────────────────
REPO_PATH="/mnt/user/appdata/git-config-backup"
REMOTE_URL=""
REMOTE_NAME="origin"
BRANCH="main"
COMMIT_PREFIX="backup:"
PUSH_AFTER_COMMIT="yes"

# ── Appdata ───────────────────────────────────────────────────────
APPDATA_PATH="/mnt/user/appdata"
MAX_FILE_SIZE_KB="500"
SKIP_CONTAINERS=""
GLOBAL_EXCLUDE="*.db,*.db-shm,*.db-wal,*.sqlite,*.sqlite3,*.sqlite-journal,*.log,*.log.*,logs/**,log/**,cache/**,Cache/**,CacheClip/**,tmp/**,temp/**,thumbnails/**,Thumbnails/**,Metadata/**,metadata/**,*.jpg,*.jpeg,*.png,*.gif,*.bmp,*.webp,*.mp4,*.mkv,*.avi,*.mp3,*.flac,*.sock,*.pid,*.lock,node_modules/**,__pycache__/**,.git/**,Plug-in Support/**,Crash Reports/**,Codecs/**,Updates/**,Diagnostics/**,Media/**"

# ── Compose ───────────────────────────────────────────────────────
COMPOSE_ENABLED="yes"
COMPOSE_PATH="/boot/config/plugins/compose.manager/projects"

# ── HAOS (Home Assistant OS) ──────────────────────────────────────
HAOS_ENABLED="no"
HAOS_HOST="homeassistant.local"
HAOS_PORT="22"
HAOS_USER="root"
HAOS_SSH_KEY="/root/.ssh/haos_backup_key"
HAOS_INCLUDE="/config/configuration.yaml,/config/automations.yaml,/config/scripts.yaml,/config/scenes.yaml,/config/secrets.yaml,/config/customize.yaml,/config/known_devices.yaml,/config/groups.yaml,/config/packages/**,/config/custom_components/**,/config/blueprints/**,/config/www/**,/config/themes/**,/config/.storage/core.config_entries,/config/.storage/core.device_registry,/config/.storage/core.entity_registry,/config/.storage/core.area_registry,/config/.storage/lovelace*"
HAOS_EXCLUDE="/config/home-assistant_v2.db,/config/home-assistant_v2.db-shm,/config/home-assistant_v2.db-wal,/config/tts/**,/config/deps/**,/config/.cloud/**,/config/backups/**"

# ── Klipper (3D printer config, over SMB) ──────────────────────────
# Pulled from the printer host's shared home directory. There's no SSH
# equivalent here — access is over CIFS/SMB, mounted read-only on demand
# for the duration of the backup, then unmounted.
#
# KLIPPER_CREDENTIALS_FILE holds "username=...\npassword=..." for the
# mount.cifs credentials= option. Unlike an SSH private key, mount.cifs
# does not refuse loose file permissions, so this can be read directly
# from /boot — but /boot is vfat, which has no real Unix permission bits,
# so treat it like the HAOS SSH key: physical access to the flash drive
# is already a full compromise, this doesn't add new exposure.
#
# KLIPPER_INCLUDE / KLIPPER_EXCLUDE are relative to KLIPPER_BASE (the
# directory *inside* the share that holds the printer's config — Moonraker's
# standard layout is <home>/printer_data/{config,logs,gcodes,database,...}).
# Only config/, systemd/*.env, and a couple of top-level files are worth
# keeping — logs/gcodes/database/backup are large, regenerable, and not
# configuration. Moonraker also auto-versions config/ with its own local
# git repo (no remote) — that nested .git is deliberately excluded so it
# can never be committed as a gitlink (see purge-paths.txt for why that
# breaks the whole nightly job), and third-party macro libraries some
# installs vendor in as their own git clone (e.g. jschuh/klipper-macros)
# are excluded the same way — reinstall those via git clone, don't back
# them up here.
KLIPPER_ENABLED="no"
KLIPPER_HOST=""
KLIPPER_SHARE="home"
KLIPPER_CREDENTIALS_FILE="/boot/config/plugins/git-backup/klipper-credentials"
KLIPPER_BASE="printer_data"
KLIPPER_INCLUDE="config/**,systemd/**,moonraker.asvc,backup-config.sh"
KLIPPER_EXCLUDE=".git,.git/**,**/.git,backup/,config-backup/,database/,gcodes/,logs/,comms/,certs/,misc/,config/printer-[0-9]*.cfg,config/dynamic-[0-9]*.cfg,config/*.zip,config/macros/*.zip,config/macros2/*.zip,config/macros/jschuh/**,config/macros2/jschuh/**,config/.moonraker.conf.bkp,config/crowsnest.conf.*"

# ── Unraid System Config ─────────────────────────────────────────
UNRAID_ENABLED="yes"
UNRAID_PATHS="/boot/config/go,/boot/config/network.cfg,/boot/config/ident.cfg,/boot/config/disk.cfg,/boot/config/share.cfg,/boot/config/smb-extra.conf,/boot/config/syslinux/syslinux.cfg"

# ── Schedule ──────────────────────────────────────────────────────
CRON_SCHEDULE="0 3 * * *"

# ── Behavior ──────────────────────────────────────────────────────
DRY_RUN="no"
NOTIFICATION="yes"
LOG_FILE="/var/log/git-backup.log"
LOG_MAX_SIZE_KB="1024"

# ── Per-Container Overrides (highest priority) ────────────────────
# Format: OVERRIDE_<FOLDERNAME>_INCLUDE="pattern1,pattern2"
#         OVERRIDE_<FOLDERNAME>_EXCLUDE="pattern1,pattern2"
# Folder name: uppercase, hyphens/dots/spaces become underscores
# Example:
# OVERRIDE_PLEX_MEDIA_SERVER_INCLUDE="Library/Application Support/Plex Media Server/Preferences.xml"
